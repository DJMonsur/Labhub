{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign out — Lab Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'auth.css' %}?v=9">
  <script>
    // Set the theme before first paint — a flash of the wrong theme on every
    // page load is the classic dark-mode bug, and it's caused by doing this
    // in a deferred script instead of inline in <head>.
    (function () {
      var saved;
      try { saved = localStorage.getItem('labhub-theme'); } catch (e) {}
      var dark = saved
        ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>

  <main class="auth-card">
    <div class="auth-body">
      <div class="auth-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="M16 17l5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
      </div>

      <div class="auth-eyebrow">Session</div>
      <h1>Sign out?</h1>
      <p>Anything in your cart will be cleared. You'll need to sign in again to make a request.</p>

      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <div class="auth-btn-group">
          <button type="submit" class="auth-btn auth-btn-danger">Sign out</button>
          <a href="/" class="auth-btn auth-btn-ghost">Stay signed in</a>
        </div>
      </form>
    </div>

    <div class="auth-foot">PSHS-CARC Lab Hub</div>
  </main>

</body>
</html>
